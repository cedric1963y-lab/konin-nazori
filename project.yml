name: KoninNazori
options:
  bundleIdPrefix: jp.hayatosuzuki
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: ja
settings:
  base:
    DEVELOPMENT_TEAM: AJ24KB4M4W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KoninNazori:
    type: application
    platform: iOS
    sources:
      - path: Konin
        excludes: ["Konin.storekit"]
      - path: Konin/Konin.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hayatosuzuki.koninnazori
        PRODUCT_NAME: KoninNazori
        INFOPLIST_FILE: Konin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        TARGETED_DEVICE_FAMILY: "1"
  KoninTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KoninTests
      - path: Konin/Konin.storekit
        buildPhase: resources
    dependencies:
      - target: KoninNazori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hayatosuzuki.koninnazori.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KoninNazori.app/KoninNazori"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  KoninNazori:
    build: { targets: { KoninNazori: all } }
    test:
      targets: [KoninTests]
    run:
      config: Debug
      storeKitConfiguration: Konin/Konin.storekit
    archive: { config: Release }
